<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<title>Illustrations</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Quicksand', sans-serif;
}

body {
  background: #000;
  color: white;
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: #b93737;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  z-index: 1000;
      font-weight: 700;

}

nav a {
  color: white;
  text-decoration: none;
}

/* SECTION */
.section {
  padding: 120px 40px;
  text-align: center;
}

/* GRID STYLE GALERIE */
.grid {
  column-count: 3;
  column-gap: 20px;
}

/* CARD */
.card {
  position: relative;
  margin-bottom: 20px;
  break-inside: avoid;
  cursor: pointer;
}

/* IMAGE + VIDEO */
.card img,
.card video {
  width: 100%;
  height: auto; /* 🔥 PLUS DE COUPE */
  border-radius: 10px;
  display: block;
}

/* VIDEO cachée */
.card video {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* HOVER */
.card:hover img {
  transform: scale(1.02);
  transition: 0.3s;
}

/* MOBILE */
@media (max-width: 900px) {
  .grid {
    column-count: 2;
  }
}

@media (max-width: 500px) {
  .grid {
    column-count: 1;
  }
}
</style>

</head>
<body>

<header>
  <div>Hanimation creation</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="travaux.html">Travaux</a>
  </nav>
</header>

<section class="section">
  <h2>Illustrations</h2>

  <div class="grid">

    <!-- COFFEESHOP -->
    <div class="card">
      <img src="illustration/coffeeshop.png">
    </div>

    <!-- GALINA SUMMER (séparé) -->
    <div class="card">
      <img src="illustration/galina_summer.png">
    </div>

    <!-- GALINA FÉE -->
    <div class="card">
      <img src="illustration/galina_fée_06.png">
      <video muted playsinline>
        <source src="illustration/galina_fée_06.mp4" type="video/mp4">
      </video>
    </div>

    <!-- KID -->
    <div class="card">
      <img src="illustration/kid_redraw.png">
    </div>

    <!-- KIRBY LANTERN -->
    <div class="card">
      <img src="illustration/kirby_chinease_lanterscape.png">
      <video muted playsinline>
        <source src="illustration/kirby_chinease_lanterscape.mp4" type="video/mp4">
      </video>
    </div>

    <!-- KIRBY SKATING -->
    <div class="card">
      <img src="illustration/Kirby_starlight_skating.png">
      <video muted playsinline>
        <source src="illustration/Kirby_starlight_skating.mp4" type="video/mp4">
      </video>
    </div>

    <!-- NEHELENIA -->
    <div class="card">
      <img src="illustration/nehelenia_kidv2.png">
    </div>

    <!-- PATINEUSE -->
    <div class="card">
      <img src="illustration/patineuse.png">
    </div>

    <!-- POISSON -->
    <div class="card">
      <img src="illustration/poissons.png">
      <video muted playsinline>
        <source src="illustration/poisson_v4.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SIRENE -->
    <div class="card">
      <img src="illustration/sirene vs monstre.png">
      <video muted playsinline>
        <source src="illustration/sirene_vs_monstre.avi" type="video/avi">
      </video>
    </div>

    <!-- YOIMIYA -->
    <div class="card">
      <img src="illustration/yoimiya_aikatsu.png">
    </div>

  </div>
</section>

<script>
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  const video = card.querySelector("video");
  const img = card.querySelector("img");

  if (!video || !img) return;

  // hover UNIQUEMENT sur l'image
  img.addEventListener("mouseenter", () => {
    video.style.opacity = "1";
    video.currentTime = 0;
    video.play();
  });

  img.addEventListener("mouseleave", () => {
    video.pause();
    video.currentTime = 0;
    video.style.opacity = "0";
  });

  video.addEventListener("ended", () => {
    video.style.opacity = "0";
  });
});
</script>

</body>
</html>
