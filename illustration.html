<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Hanimation Creation - Illustrations</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Quicksand', sans-serif;
}

body {
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  color: white;
  min-height: 100vh;
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: #b93737;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  z-index: 1000;
}

.logo {
  font-size: 1.2rem;
  font-weight: 700;
  color: white;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: white;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

nav a:hover {
  opacity: 0.8;
}

/* SECTION */
.section {
  padding: 120px 40px 80px;
  text-align: center;
  max-width: 1400px;
  margin: 0 auto;
}

.section h2 {
  font-size: 48px;
  color: #b93737;
  margin-bottom: 20px;
  font-weight: 600;
}

.section p.subtitle {
  font-size: 18px;
  color: #ccc;
  margin-bottom: 50px;
}

/* GRID STYLE GALERIE - Masonry layout */
.grid {
  column-count: 3;
  column-gap: 25px;
}

/* CARD */
.card {
  position: relative;
  margin-bottom: 25px;
  break-inside: avoid;
  cursor: pointer;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 30px rgba(185, 55, 55, 0.3);
}

/* IMAGE + VIDEO */
.card img,
.card video {
  width: 100%;
  height: auto;
  border-radius: 15px;
  display: block;
  transition: transform 0.3s ease;
}

.card:hover img {
  transform: scale(1.02);
}

/* VIDEO cachée au-dessus de l'image */
.card video {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 2;
}

/* FOOTER */
footer {
  background: #b93737;
  padding: 20px;
  text-align: center;
  font-size: 14px;
  color: white;
  margin-top: 20px;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .section {
    padding: 100px 20px 60px;
  }
  
  .section h2 {
    font-size: 36px;
  }
  
  .grid {
    column-count: 2;
    column-gap: 20px;
  }
}

@media (max-width: 500px) {
  .grid {
    column-count: 1;
  }
  
  .section {
    padding: 90px 15px 60px;
  }
}
</style>

</head>
<body>

<header>
  <div class="logo">Hanimation Creation</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="travaux.html">Travaux</a>
    <a href="index.html#about">À propos</a>
  </nav>
</header>

<section class="section">
  <h2>Illustrations</h2>
  <p class="subtitle">Passez la souris sur certaines images pour voir l'animation</p>

  <div class="grid">

    <!-- COFFEESHOP -->
    <div class="card">
      <img src="illustration/coffeeshop.png" alt="Coffee Shop">
    </div>

    <!-- GALINA SUMMER -->
    <div class="card">
      <img src="illustration/galina_summer.png" alt="Galina Summer">
    </div>

    <!-- GALINA FÉE -->
    <div class="card">
      <img src="illustration/galina_fée_06.png" alt="Galina Fée">
      <video muted playsinline loop>
        <source src="illustration/galina_fée_06.mp4" type="video/mp4">
      </video>
    </div>

    <!-- KID -->
    <div class="card">
      <img src="illustration/kid_redraw.png" alt="Kid Redraw">
    </div>

    <!-- KIRBY LANTERN -->
    <div class="card">
      <img src="illustration/kirby_chinease_lanterscape.png" alt="Kirby Lantern">
      <video muted playsinline loop>
        <source src="illustration/kirby_chinease_lanterscape.mp4" type="video/mp4">
      </video>
    </div>

    <!-- KIRBY SKATING -->
    <div class="card">
      <img src="illustration/Kirby_starlight_skating.png" alt="Kirby Skating">
      <video muted playsinline loop>
        <source src="illustration/Kirby_starlight_skating.mp4" type="video/mp4">
      </video>
    </div>

    <!-- NEHELENIA -->
    <div class="card">
      <img src="illustration/nehelenia_kidv2.png" alt="Nehelenia">
    </div>

    <!-- PATINEUSE -->
    <div class="card">
      <img src="illustration/patineuse.png" alt="Patineuse">
    </div>

    <!-- POISSON -->
    <div class="card">
      <img src="illustration/poissons.png" alt="Poissons">
      <video muted playsinline loop>
        <source src="illustration/poisson_v4.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SIRENE -->
    <div class="card">
      <img src="illustration/sirene vs monstre.png" alt="Sirène vs Monstre">
      <video muted playsinline loop>
        <source src="illustration/sirene_vs_monstre.mp4" type="video/mp4">
      </video>
    </div>

    <!-- YOIMIYA -->
    <div class="card">
      <img src="illustration/yoimiya_aikatsu.png" alt="Yoimiya">
    </div>

  </div>
</section>

<footer>
  © 2026 Halima Ait Amer
</footer>

<script>
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  const video = card.querySelector("video");
  const img = card.querySelector("img");

  if (!video || !img) return;

  // Au survol de la carte : lecture de la vidéo
  card.addEventListener("mouseenter", () => {
    if (video) {
      video.style.opacity = "1";
      video.currentTime = 0;
      video.play();
    }
  });

  card.addEventListener("mouseleave", () => {
    if (video) {
      video.pause();
      video.currentTime = 0;
      video.style.opacity = "0";
    }
  });
});
</script>

</body>
</html>
