<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illustrations</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #000;
  color: white;
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: #b93737;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
}

nav a {
  color: white;
  text-decoration: none;
}

/* SECTION */
.section {
  padding: 120px 20px;
  text-align: center;
}

/* GRID */
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

/* CARD */
.card {
  position: relative;
  width: 300px;
  height: 200px;
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;
}

/* IMAGE + VIDEO */
.card img,
.card video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* VIDEO cachée */
.card video {
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* HOVER */
.card:hover img {
  transform: scale(1.05);
  transition: 0.3s;
}
</style>

</head>
<body>

<header>
  <div>Hanimation creation</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="travaux.html">Travaux</a>
  </nav>
</header>

<section class="section">
  <h2>Illustrations</h2>

  <div class="grid">

    <div class="card">
      <img src="illustration/coffeeshop.png">
    </div>

    <div class="card">
      <img src="illustration/galina_summer.png">
      <video muted playsinline>
        <source src="illustration/galina_fée_06.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <img src="illustration/kid_redraw.png">
    </div>

    <div class="card">
      <img src="illustration/kirby_chinease_lanterscape.png">
      <video muted playsinline>
        <source src="illustration/kirby_chinease_lanterscape.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <img src="illustration/Kirby_starlight_skating.png">
      <video muted playsinline>
        <source src="illustration/Kirby_starlight_skating.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <img src="illustration/nehelenia_kidv2.png">
    </div>

    <div class="card">
      <img src="illustration/patineuse.png">
    </div>

    <div class="card">
      <img src="illustration/poissons.png">
      <video muted playsinline>
        <source src="illustration/poisson_v4.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <img src="illustration/sirene vs monstre.png">
      <video muted playsinline>
        <source src="illustration/sirene_vs_monstre.avi" type="video/avi">
      </video>
    </div>

    <div class="card">
      <img src="illustration/yoimiya_aikatsu.png">
    </div>

  </div>

</section>

<script>
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  const video = card.querySelector("video");

  if (!video) return;

  card.addEventListener("mouseenter", () => {
    video.style.opacity = "1";
    video.currentTime = 0;
    video.play();
  });

  video.addEventListener("ended", () => {
    video.style.opacity = "0";
  });
});
</script>

</body>
</html>
