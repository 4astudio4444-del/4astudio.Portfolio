<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Hanimation Creation - Mes Travaux</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: rgb(255, 227, 227);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      position: fixed;
      width: 100%;
      background: #b93737;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      z-index: 1000;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.8;
    }

    /* SECTION */
    .section {
      padding: 120px 40px 80px;
      text-align: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section h2 {
      font-size: 48px;
      color: #b93737;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .section p.subtitle {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 50px;
    }

    /* GRID - responsive */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      margin-top: 20px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    /* CARD */
    .card {
      position: relative;
      aspect-ratio: 2 / 3;
      border-radius: 15px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(185, 55, 55, 0.3);
    }

    /* IMAGE */
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    /* OVERLAY */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
      transition: 0.3s;
    }

    .card:hover::after {
      background: linear-gradient(to top, rgba(185, 55, 55, 0.4), rgba(0,0,0,0.1));
    }

    /* TEXTE - bande en bas */
    .card p {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #b93737;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2;
      transition: 0.3s;
      letter-spacing: 1px;
    }

    .card:hover p {
      color: white;
      background: rgba(185, 55, 55, 0.8);
      padding: 22px;
    }

    /* FOOTER */
    footer {
      background: #b93737;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: white;
      margin-top: 40px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .section {
        padding: 100px 20px 60px;
      }

      .section h2 {
        font-size: 36px;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card p {
        font-size: 18px;
        padding: 15px;
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Hanimation Creation</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="travaux.html">Travaux</a>
    <a href="index.html#about">À propos</a>
  </nav>
</header>

<section class="section">
  <h2>Mes travaux</h2>
  <p class="subtitle">Découvrez mon univers créatif à travers différents projets</p>

  <div class="grid">

    <a href="illustration.html" class="card">
      <img src="illustration.png" alt="Illustration">
      <p>Illustration</p>
    </a>

    <a href="animation.html" class="card">
      <img src="animation.gif" alt="Animation">
      <p>Animation</p>
    </a>

    <a href="projet.html" class="card">
      <img src="projet.png" alt="Projet personnel">
      <p>Projet personnel</p>
    </a>

  </div>
</section>

<footer>
  © 2026 Halima Ait Amer
</footer>

</body>
</html>
