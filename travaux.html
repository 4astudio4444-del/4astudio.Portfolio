<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travaux</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #000;
  color: rgb(255, 227, 227);
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: #b93737;
  color: white;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: white;
}

/* SECTION */
.section {
  padding: 120px 20px 60px;
  text-align: center;
}

/* GRID */
.grid {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 40px;
}

/* CARDS */
.card {
  background: #111;
  width: 280px;
  border-radius: 15px;
  overflow: hidden;
  transition: 0.3s;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

/* TEXTE */
.card p {
  padding: 15px;
  color: #b93737;
  font-weight: bold;
}
.card:hover p {
  color: white;
}
/* HOVER */
.card:hover {
  transform: scale(1.05);
}

/* MOBILE */
@media (max-width: 768px) {
  .card {
    width: 90%;
  }
}

/* rendre les cartes cliquables sans casser le style */
.card {
  text-decoration: none;
  color: inherit;
  display: block;
}
</style>

</head>
<body>

<header>
  <div class="logo">Hanimation creation</div>
  <nav>
    <a href="index.html">Accueil</a>
  </nav>
</header>

<section class="section">
  <h2>Mes travaux</h2>

 <div class="grid">

  <a href="illustration.html" class="card">
    <img src="illustration.png" alt="illustration">
    <p>Illustration</p>
  </a>

  <a href="animation.html" class="card">
    <img src="animation.gif" alt="animation">
    <p>Animation</p>
  </a>

  <a href="projet.html" class="card">
    <img src="projet.png" alt="projet">
    <p>Projet personnel</p>
  </a>

</div>
</section>

</body>
</html>
