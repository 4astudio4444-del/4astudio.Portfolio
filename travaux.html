<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<title>Travaux</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Quicksand', sans-serif;
}

body {
  background: #000;
  color: rgb(255, 227, 227);
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: #b93737;
  color: rgb(255, 227, 227);
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  z-index: 1000;
      font-weight: 700;

}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: rgb(255, 227, 227);
}

/* SECTION */
.section {
  padding: 120px 40px 60px;
  text-align: center;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 400px); /* 🔥 taille fixe */
  justify-content: center; /* centre la grille */
  gap: 20px;
  margin-top: 50px;
}

/* CARD */
.card {
  position: relative;
  aspect-ratio: 2 / 3; 
  border-radius: 15px;
  overflow: hidden;
  text-decoration: none;
  display: block;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

/* OVERLAY */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
  transition: 0.3s;
}

/* TEXTE */
/* BANDE BAS */
.card p {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: #b93737;
  background: rgba(0, 0, 0, 0.6);
  z-index: 2;
  transition: 0.3s;
}
.card:hover p {
  color: rgb(255, 227, 227);
}
/* HOVER */
.card:hover img {
  transform: scale(1.07);

}

.card:hover::after {
  background: rgba(0,0,0,0.1);
}

/* MOBILE */
@media (max-width: 768px) {
  .card {
    height: 180px;
  }

  .card p {
    font-size: 20px;
  }
}
</style>

</head>
<body>

<header>
  <div class="logo">Hanimation creation</div>
  <nav>
    <a href="index.html">Accueil</a>
  </nav>
</header>

<section class="section">
  <h2>Mes travaux</h2>

  <div class="grid">

    <a href="illustration.html" class="card">
      <img src="illustration.png" alt="illustration">
      <p>Illustration</p>
    </a>

    <a href="animation.html" class="card">
      <img src="animation.gif" alt="animation">
      <p>Animation</p>
    </a>

    <a href="projet.html" class="card">
      <img src="projet.png" alt="projet">
      <p>Projet personnel</p>
    </a>

  </div>
</section>

</body>
</html>
