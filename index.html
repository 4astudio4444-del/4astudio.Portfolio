<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Hanimation Creation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- IMAGE OVERLAY pour portrait -->
  <img src="UpPage.png" class="bg-overlay">
  
  <!-- IMAGE OVERLAY pour travaux -->
  <img src="travaux_back.png" class="bg-overlay-travaux">

  <header>
    <div class="logo">Hanimation Creation</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="travaux.html">Travaux</a>
      <a href="#about">À propos</a>
    </nav>
  </header>

  <section class="hero">
    <div class="slider">

      <!-- PORTRAIT -->
      <div class="slide active portrait-slide">
        <video id="portraitVideo" muted loop playsinline>
          <source src="portrait.webm" type="video/webm">
        </video>
        <h1>Mon univers artistique</h1>
      </div>

      <!-- DEMOREEL -->
      <div class="slide demoreel-slide">
        <video id="demoreel" muted loop playsinline controls>
          <source src="showreel.mp4" type="video/mp4">
        </video>
        <h1>Demoreel</h1>
      </div>

      <!-- TRAVAUX - MÊME STRUCTURE QUE PORTRAIT -->
      <div class="slide travaux-slide">
        <a href="travaux.html" class="travaux-link">
          <img src="travaux_front.png" alt="Travaux" class="travaux-image">
          <h1>Mes Travaux</h1>
        </a>
      </div>

    </div>

    <div class="controls">
      <button onclick="prevSlide()">←</button>
      <button onclick="nextSlide()">→</button>
    </div>
  </section>

  <footer>
    © 2026 Halima Ait Amer
  </footer>

  <script>
    let current = 0;
    const slides = document.querySelectorAll(".slide");
    const demoreel = document.getElementById("demoreel");
    const portrait = document.getElementById("portraitVideo");
    const bgOverlay = document.querySelector(".bg-overlay");
    const bgOverlayTravaux = document.querySelector(".bg-overlay-travaux");
    const controls = document.querySelector(".controls");

    function showSlide(index) {
      slides.forEach((slide) => {
        slide.classList.remove("active");

        let video = slide.querySelector("video");
        if (video) {
          video.pause();
          video.currentTime = 0;
        }
      });

      const activeSlide = slides[index];
      activeSlide.classList.add("active");

      const activeVideo = activeSlide.querySelector("video");

      /* Tous les boutons à la même hauteur */
      controls.style.bottom = "80px";

      /* FOND + OVERLAY selon le slide */
      if (activeSlide.classList.contains("portrait-slide")) {
        document.body.style.background = "linear-gradient(to right, #ffe5d9, #ffd6c9, #ffc2b3, #ffb7a5)";
        bgOverlay.style.opacity = "1";
        bgOverlayTravaux.style.opacity = "0";
      } else if (activeSlide.classList.contains("demoreel-slide")) {
        document.body.style.background = "linear-gradient(to right, #ffe4e1, #ffd1dc, #ffc1cc)";
        bgOverlay.style.opacity = "0";
        bgOverlayTravaux.style.opacity = "0";
      } else if (activeSlide.classList.contains("travaux-slide")) {
        document.body.style.background = "linear-gradient(90deg, #ffdfdb 19%, #f0b8ff 92%)";
        bgOverlay.style.opacity = "0";
        bgOverlayTravaux.style.opacity = "1";
      }

      /* LANCEMENT VIDEO */
      if (activeVideo) {
        activeVideo.play();
      }

      current = index;
    }

    function nextSlide() {
      showSlide((current + 1) % slides.length);
    }

    function prevSlide() {
      showSlide((current - 1 + slides.length) % slides.length);
    }

    function goProjects() {
      window.location.href = "travaux.html";
    }

    /* IMPORTANT : lancer dès le chargement */
    window.onload = () => {
      showSlide(0);
    };
  </script>

</body>
</html>
